[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-life"
version = "0.1.0"
description = "可自主进化的数字生命生态系统（人工生命模拟器）"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
viz = ["pygame>=2.5"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["core", "world", "evolution", "brain", "simulation", "visualization", "persistence"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]